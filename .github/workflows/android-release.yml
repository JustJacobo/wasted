# Publica el APK de Android (la app nativa de mobile/) en GitHub Releases al
# subir un tag android-vX.Y.Z:
#   git tag android-v2.0.0 && git push origin android-v2.0.0
# El enlace estable es https://github.com/JustJacobo/wasted/releases/latest/download/wasted.apk
# Las de prueba (android-v2.0.0-beta.1) salen como prerelease: el enlace estable
# no cambia y su versionCode queda por debajo de la final (ver app.config.ts).
#
# Secretos del repo: ANDROID_KEYSTORE_BASE64 (el .jks en base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD. Tiene que ser el mismo keystore de siempre:
# si no, el APK no se instala encima de la versión anterior.
name: APK de Android

on:
  push:
    tags: ["android-v*"]
  # Para repetir una versión: "Run workflow" eligiendo el tag.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Versión desde el tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^android-v([0-9]+)\.([0-9]+)\.([0-9]+)(-beta\.([0-9]+))?$ ]]; then
            echo "::error::El tag debe ser android-vX.Y.Z o android-vX.Y.Z-beta.N (llegó '$TAG')"
            exit 1
          fi
          if [ -n "${BASH_REMATCH[5]}" ] && [ "${BASH_REMATCH[5]}" -ge 100 ]; then
            echo "::error::Las betas van de 1 a 99"
            exit 1
          fi
          echo "name=${TAG#android-v}" >> "$GITHUB_OUTPUT"
          echo "beta=${BASH_REMATCH[5]}" >> "$GITHUB_OUTPUT"

      - name: Dependencias
        run: npm ci

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wasted.jks"
          # Lo lee el plugin plugins/with-release-signing.js.
          {
            echo "storeFile=$RUNNER_TEMP/wasted.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # Sin .env: la app apunta a producción (src/core/config.ts).
      - name: Generar el proyecto Android
        env:
          WASTED_VERSION: ${{ steps.version.outputs.name }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar
        working-directory: mobile/android
        env:
          WASTED_VERSION: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Comprobar la firma contra assetlinks.json
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          GOT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}' \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          WANT=$(jq -r '.[0].target.sha256_cert_fingerprints[0]' ../public/.well-known/assetlinks.json)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::La firma del APK ($GOT) no coincide con assetlinks.json ($WANT)"
            exit 1
          fi
          cp "$APK" "$RUNNER_TEMP/wasted.apk"

      - name: Publicar el Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/wasted.apk" --clobber
          elif [ -n "$BETA" ]; then
            gh release create "$TAG" "$RUNNER_TEMP/wasted.apk" \
              --title "Wasted Android $VERSION (prueba)" \
              --notes "Versión de prueba. Se instala encima de la app que ya tienes; al abrirla, entra de nuevo con tu cuenta." \
              --prerelease
          else
            gh release create "$TAG" "$RUNNER_TEMP/wasted.apk" \
              --title "Wasted Android $VERSION" \
              --notes "Descarga **wasted.apk**, ábrelo y permite instalar apps de esa fuente si Android lo pide. Para entrar hace falta una invitación." \
              --latest
          fi

      - name: Borrar el keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/wasted.jks" keystore.properties
